<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Boxing Interval Timer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Boxing Timer">
<style>
  :root {
    --bg: #000;
    --fg: #e8e8e8;
    --muted: #8a8a8a;
    --green: #22ff55;
    --green-soft: #4fe0b0;
    --sprint: #ff4d3d;
    --rest: #4da3ff;
    --panel: #141414;
    --line: #2a2a2a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; min-height: 100dvh; }

  header { display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; font-size: 1.1rem; color: var(--muted); }
  header .round { font-weight: 600; color: var(--fg); }

  main { flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; padding: 0 16px; }
  #phase { font-size: clamp(1.6rem, 7vw, 3.5rem); font-weight: 800; letter-spacing: .12em;
    text-transform: uppercase; min-height: 1.2em; }
  #phase.prep   { color: #ffd23d; }
  #phase.sprint { color: var(--sprint); }
  #phase.normal { color: var(--fg); }
  #phase.rest   { color: var(--rest); }
  #phase.done   { color: var(--green); }
  #clock { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums; font-weight: 700; color: var(--green);
    font-size: clamp(6rem, 32vw, 26rem); line-height: 1; margin: .05em 0;
    text-shadow: 0 0 .15em rgba(34,255,85,.35); }
  #sub { font-size: clamp(1.4rem, 6vw, 2.6rem); font-weight: 600; color: var(--green-soft); min-height: 1.3em;
    font-variant-numeric: tabular-nums; }
  #next { font-size: clamp(1.15rem, 4.5vw, 1.9rem); color: var(--green-soft); opacity: .8; margin-top: .4em; min-height: 1.3em;
    font-variant-numeric: tabular-nums; }

  .controls { display: flex; gap: 12px; justify-content: center; padding: 16px; flex-wrap: wrap; }
  button { font: inherit; font-size: 1.15rem; font-weight: 600; border: 1px solid var(--line);
    background: var(--panel); color: var(--fg); border-radius: 12px; padding: 14px 26px;
    cursor: pointer; min-width: 120px; }
  button.primary { background: var(--green); color: #000; border-color: var(--green); }
  button[hidden] { display: none; }
  button:active { transform: scale(.97); }

  details { margin: 0 16px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
  summary { padding: 14px 16px; cursor: pointer; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px; padding: 0 16px 16px; }
  label { display: flex; flex-direction: column; gap: 6px; font-size: .9rem; color: var(--muted); }
  input[type=number] { font: inherit; font-size: 1.1rem; padding: 10px; border-radius: 8px;
    border: 1px solid var(--line); background: #000; color: var(--fg); width: 100%; }
  .row { display: flex; gap: 12px; align-items: center; padding: 0 16px 16px; flex-wrap: wrap; }
  .row label { flex-direction: row; align-items: center; gap: 8px; }
  .summary { padding: 0 16px 16px; color: var(--muted); font-size: .9rem; }
  .row button { min-width: 0; padding: 10px 16px; font-size: .95rem; }
</style>
</head>
<body>
<header>
  <span class="round" id="roundLabel">Ready</span>
  <span id="totalLabel"></span>
</header>

<main>
  <div id="phase"></div>
  <div id="clock">0:10</div>
  <div id="sub"></div>
  <div id="next"></div>
</main>

<div class="controls">
  <button class="primary" id="startBtn">Start</button>
  <button id="resetBtn">Reset</button>
  <button id="installBtn" hidden>Install app</button>
</div>

<details id="settings">
  <summary>Settings</summary>
  <div class="grid">
    <label>Preparation (s)<input type="number" id="prep" min="0" max="600"></label>
    <label>Sprint (s)<input type="number" id="sprint" min="1" max="600"></label>
    <label>Normal (s)<input type="number" id="normal" min="0" max="600"></label>
    <label>Round length (s)<input type="number" id="round" min="1" max="3600"></label>
    <label>Break (s)<input type="number" id="rest" min="0" max="3600"></label>
    <label>Rounds<input type="number" id="rounds" min="1" max="50"></label>
    <label>Volume (%)<input type="number" id="volume" min="0" max="100"></label>
  </div>
  <div class="row">
    <label><input type="checkbox" id="countdown"> Countdown pips in the last 3 s of prep &amp; breaks</label>
  </div>
  <div class="row">
    <button id="testShort">Test short tone</button>
    <button id="testLong">Test long tone</button>
    <button id="defaults">Restore defaults</button>
  </div>
  <div class="summary" id="planSummary"></div>
</details>

<script>
(() => {
  const DEFAULTS = { prep: 10, sprint: 10, normal: 20, round: 180, rest: 60, rounds: 4, volume: 80, countdown: true };
  const KEY = 'boxing-timer-settings';
  const $ = id => document.getElementById(id);
  const fields = ['prep', 'sprint', 'normal', 'round', 'rest', 'rounds', 'volume'];

  // ---------- settings ----------
  let cfg = { ...DEFAULTS };
  try { Object.assign(cfg, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}

  function writeInputs() {
    fields.forEach(f => $(f).value = cfg[f]);
    $('countdown').checked = !!cfg.countdown;
  }
  function readInputs() {
    fields.forEach(f => {
      const el = $(f);
      let v = Math.round(Number(el.value));
      if (!Number.isFinite(v)) v = DEFAULTS[f];
      v = Math.min(Number(el.max), Math.max(Number(el.min), v));
      cfg[f] = v;
    });
    cfg.countdown = $('countdown').checked;
    try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch (e) {}
  }

  // ---------- plan ----------
  // A list of segments: {type, dur, round, label}
  function buildPlan(c) {
    const segs = [];
    if (c.prep > 0) segs.push({ type: 'prep', dur: c.prep, round: 0 });
    for (let r = 1; r <= c.rounds; r++) {
      let left = c.round, sprint = true;
      while (left > 0) {
        const want = sprint ? c.sprint : c.normal;
        if (want > 0) {
          const d = Math.min(want, left);
          segs.push({ type: sprint ? 'sprint' : 'normal', dur: d, round: r });
          left -= d;
        }
        sprint = !sprint;
      }
      if (r < c.rounds && c.rest > 0) segs.push({ type: 'rest', dur: c.rest, round: r });
    }
    let t = 0;
    segs.forEach(s => { s.start = t; t += s.dur; });
    return { segs, total: t };
  }

  const NAMES = { prep: 'Get ready', sprint: 'Sprint', normal: 'Normal', rest: 'Break', done: 'Done' };

  // ---------- audio ----------
  let ac = null;
  function audio() {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function tone(freq, dur, when = 0) {
    const a = audio();
    const t0 = a.currentTime + when;
    const vol = (cfg.volume / 100) * 0.6;
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'square';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(vol, 0.0002), t0 + 0.01);
    g.gain.setValueAtTime(Math.max(vol, 0.0002), t0 + dur - 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(a.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  const shortTone = () => tone(1000, 0.18);                      // between short intervals
  const longTone  = () => tone(660, 1.4);                        // start/end of the breaks
  const pip       = () => tone(1400, 0.07);                      // optional countdown
  const finalTone = () => { tone(660, 0.6); tone(660, 0.6, 0.8); tone(880, 1.4, 1.6); };

  // ---------- wake lock ----------
  let wakeLock = null;
  async function keepAwake(on) {
    try {
      if (on && 'wakeLock' in navigator && !wakeLock) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      } else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
    } catch (e) {}
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && state === 'running') keepAwake(true);
  });

  // ---------- engine ----------
  let plan = buildPlan(cfg);
  let state = 'idle';            // idle | running | paused | done
  let startedAt = 0;             // performance.now() when elapsed was 0
  let pausedElapsed = 0;
  let segIndex = -1;
  let lastPipSec = null;
  let timer = null;

  const fmt = s => {
    s = Math.max(0, Math.ceil(s - 1e-6));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  };
  const elapsed = () => state === 'running' ? (performance.now() - startedAt) / 1000 : pausedElapsed;

  function findSeg(t) {
    const s = plan.segs;
    for (let i = 0; i < s.length; i++) if (t < s[i].start + s[i].dur) return i;
    return s.length;
  }

  function onEnterSegment(i, prev) {
    const seg = plan.segs[i];
    if (!seg) { finalTone(); return; }
    const prevSeg = prev >= 0 ? plan.segs[prev] : null;
    // Long tone marks the breaks: entering a break, and leaving a break / prep into a round.
    if (seg.type === 'rest' || (prevSeg && (prevSeg.type === 'rest' || prevSeg.type === 'prep'))) longTone();
    else if (!prevSeg && seg.type !== 'prep') longTone();   // no prep: start round 1 with long tone
    else if (prevSeg) shortTone();
  }

  function tick() {
    const t = elapsed();
    const i = findSeg(t);
    if (i !== segIndex) {
      // Fire tones for the segment we're now in (skip intermediate ones if the tab was asleep).
      if (state === 'running') onEnterSegment(i, segIndex);
      segIndex = i;
      lastPipSec = null;
    }
    if (i >= plan.segs.length) { finish(); return; }

    const seg = plan.segs[i];
    const remain = seg.start + seg.dur - t;
    if (cfg.countdown && state === 'running' && (seg.type === 'prep' || seg.type === 'rest')) {
      const sec = Math.ceil(remain);
      if (sec <= 3 && sec >= 1 && sec !== lastPipSec) { lastPipSec = sec; pip(); }
    }
    render(seg, remain, t);
  }

  function render(seg, remain, t) {
    const phase = $('phase');
    phase.className = seg.type;
    phase.textContent = NAMES[seg.type];
    $('clock').textContent = fmt(remain);

    if (seg.type === 'sprint' || seg.type === 'normal') {
      $('roundLabel').textContent = `Round ${seg.round} / ${cfg.rounds}`;
      const roundStart = plan.segs.find(s => s.round === seg.round && s.type !== 'rest' && s.type !== 'prep').start;
      $('sub').textContent = 'Round time left ' + fmt(roundStart + cfg.round - t);
    } else if (seg.type === 'rest') {
      $('roundLabel').textContent = `Break after round ${seg.round} / ${cfg.rounds}`;
      $('sub').textContent = `Next: round ${seg.round + 1}`;
    } else {
      $('roundLabel').textContent = 'Preparation';
      $('sub').textContent = `${cfg.rounds} rounds ahead`;
    }
    const nxt = plan.segs[segIndex + 1];
    $('next').textContent = nxt ? `Then: ${NAMES[nxt.type]} ${fmt(nxt.dur)}` : 'Last interval';
    $('totalLabel').textContent = 'Total left ' + fmt(plan.total - t);
  }

  function renderIdle() {
    plan = buildPlan(cfg);
    const first = plan.segs[0];
    $('phase').className = first ? first.type : '';
    $('phase').textContent = first ? NAMES[first.type] : '';
    $('clock').textContent = fmt(first ? first.dur : 0);
    $('roundLabel').textContent = 'Ready';
    $('sub').textContent = `${cfg.rounds} × ${fmt(cfg.round)} rounds, ${fmt(cfg.rest)} breaks`;
    $('next').textContent = '';
    $('totalLabel').textContent = 'Total ' + fmt(plan.total);
    $('planSummary').textContent =
      `Each round: ${cfg.sprint}s sprint / ${cfg.normal}s normal, repeated for ${cfg.round}s. ` +
      `Total workout ${fmt(plan.total)} including ${cfg.prep}s preparation.`;
  }

  function start() {
    audio(); // unlock audio on the user's tap
    if (state === 'idle' || state === 'done') {
      readInputs();
      plan = buildPlan(cfg);
      if (!plan.segs.length) return;
      pausedElapsed = 0;
      segIndex = -1;
    }
    startedAt = performance.now() - pausedElapsed * 1000;
    state = 'running';
    $('startBtn').textContent = 'Pause';
    $('settings').open = false;
    keepAwake(true);
    clearInterval(timer);
    timer = setInterval(tick, 50);
    tick();
  }
  function pause() {
    pausedElapsed = elapsed();
    state = 'paused';
    clearInterval(timer);
    $('startBtn').textContent = 'Resume';
    keepAwake(false);
  }
  function finish() {
    clearInterval(timer);
    state = 'done';
    keepAwake(false);
    $('phase').className = 'done';
    $('phase').textContent = NAMES.done;
    $('clock').textContent = '0:00';
    $('roundLabel').textContent = `${cfg.rounds} rounds complete`;
    $('sub').textContent = 'Great work!';
    $('next').textContent = '';
    $('totalLabel').textContent = '';
    $('startBtn').textContent = 'Start again';
  }
  function reset() {
    clearInterval(timer);
    state = 'idle';
    pausedElapsed = 0;
    segIndex = -1;
    keepAwake(false);
    $('startBtn').textContent = 'Start';
    renderIdle();
  }

  $('startBtn').addEventListener('click', () => state === 'running' ? pause() : start());
  $('resetBtn').addEventListener('click', reset);
  $('testShort').addEventListener('click', () => { readInputs(); shortTone(); });
  $('testLong').addEventListener('click', () => { readInputs(); longTone(); });
  $('defaults').addEventListener('click', () => { cfg = { ...DEFAULTS }; writeInputs(); readInputs(); if (state === 'idle' || state === 'done') reset(); });
  document.querySelectorAll('#settings input').forEach(el => el.addEventListener('change', () => {
    readInputs();
    if (state === 'idle' || state === 'done') reset();
    else $('planSummary').textContent = 'Changes apply after Reset.';
  }));
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') { e.preventDefault(); $('startBtn').click(); }
    if (e.key === 'r' || e.key === 'R') reset();
  });

  // ---------- install (PWA) ----------
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  let installEvt = null;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    installEvt = e;
    $('installBtn').hidden = false;
  });
  $('installBtn').addEventListener('click', async () => {
    if (!installEvt) return;
    installEvt.prompt();
    try { await installEvt.userChoice; } catch (e) {}
    installEvt = null;
    $('installBtn').hidden = true;
  });
  window.addEventListener('appinstalled', () => { $('installBtn').hidden = true; });

  writeInputs();
  renderIdle();
})();
</script>
</body>
</html>
